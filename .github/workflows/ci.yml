name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on a PR; let runs on main finish in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so the build can stamp its version with git describe.
          fetch-depth: 0
      - uses: ./.github/actions/build

  # Every merge to main goes to the test environment.
  deploy-test:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: test
    secrets: inherit
    permissions:
      contents: read
      id-token: write
