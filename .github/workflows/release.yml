name: Release

# Publishing a GitHub Release (with a v* tag on a main commit) deploys that commit to production.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, for the main check below and the build's version stamp.
          fetch-depth: 0
      - name: Check the release is a commit on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME isn't on main. Only release commits from main."
            exit 1
          }
      - uses: ./.github/actions/build

  deploy-production:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
    permissions:
      contents: read
      id-token: write
